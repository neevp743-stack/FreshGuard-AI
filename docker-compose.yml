version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freshguard_db
    restart: always
    environment:
      POSTGRES_USER: freshguard
      POSTGRES_PASSWORD: freshguard_pass
      POSTGRES_DB: freshguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://freshguard:freshguard_pass@db:5432/freshguard_db
      - SECRET_KEY=freshguard_super_secret_jwt_key_change_in_production_2026
    depends_on:
      - db

volumes:
  postgres_data:
