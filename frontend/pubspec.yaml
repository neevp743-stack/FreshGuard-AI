name: freshguard_ai
description: "Know. Use. Refill. Waste Less. AI-powered household food & grocery management mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^5.1.1
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
